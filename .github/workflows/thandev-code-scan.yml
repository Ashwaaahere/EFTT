name: Thandev Code Scan

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
  pull_request: {}

jobs:
  code-scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      THANDEV_BASE_URL: https://thandev-backend.fly.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Thandev code-scan API
        shell: bash
        run: |
          set -euo pipefail
          echo "Pinging: ${THANDEV_BASE_URL}/api/code-scans/ping"
          curl -sS -i "${THANDEV_BASE_URL}/api/code-scans/ping" | head -n 30 || true

      - name: Request OIDC token (GitHub native)
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('thandev');
            core.setOutput('id_token', token);

      - name: Inspect OIDC token claims (debug)
        shell: bash
        env:
          TOKEN: ${{ steps.oidc.outputs.id_token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, base64
          t = os.environ["TOKEN"]
          h,p,_ = t.split(".")
          def b64(s):
            s += "=" * (-len(s) % 4)
            return json.loads(base64.urlsafe_b64decode(s.encode()).decode())
          header = b64(h)
          payload = b64(p)
          safe = {k: payload.get(k) for k in ["iss","aud","sub","repository","ref","sha","actor","iat","exp"]}
          print("HEADER:", json.dumps({k: header.get(k) for k in ["alg","kid","typ"]}, indent=2))
          print("PAYLOAD subset:", json.dumps(safe, indent=2))
          PY

      - name: Get Thandev ingest token (OIDC exchange)
        id: token
        shell: bash
        env:
          # ✅ THIS was missing in your run → KeyError + empty body (422)
          OIDC_TOKEN: ${{ steps.oidc.outputs.id_token }}
        run: |
          set -euo pipefail

          URL="${THANDEV_BASE_URL}/api/code-scans/oidc/exchange/github"
          echo "Exchange URL: $URL"

          JSON_BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({"oidc_token": os.environ["OIDC_TOKEN"]}))
          PY
          )"

          RESP="$(
            curl -sS -w "\nHTTP_STATUS=%{http_code}\n" \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "$JSON_BODY"
          )"

          STATUS="$(echo "$RESP" | sed -n 's/^HTTP_STATUS=//p')"
          BODY="$(echo "$RESP" | sed '/^HTTP_STATUS=/d')"

          echo "Exchange HTTP: $STATUS"
          echo "Exchange body: $BODY"

          if [ "$STATUS" != "200" ]; then
            echo "❌ OIDC exchange failed."
            exit 1
          fi

          ACCESS_TOKEN="$(python -c "import json,sys; print(json.loads(sys.argv[1])['access_token'])" "$BODY")"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Semgrep (SAST)
        run: |
          semgrep scan --config=auto --json --output semgrep-output.json .

      - name: Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format json --report-path gitleaks.json --no-git

      - name: OSV-Scanner (Dependencies)
        shell: bash
        run: |
          set -e

          if ls package-lock.json yarn.lock pnpm-lock.yaml requirements.txt poetry.lock Pipfile.lock go.mod go.sum Cargo.lock 2>/dev/null; then
            curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
            chmod +x ./osv-scanner
            ./osv-scanner scan --format=json --output osv.json . || true
          else
            echo "No dependency manifests found. Skipping OSV scan."
            echo '{}' > osv.json
          fi

      - name: Trivy FS (Vuln + Misconfig)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          scanners: vuln,misconfig
          ignore-unfixed: true

      - name: Syft (SBOM - CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: syft_sbom.json

      - name: Ingest to Thandev
        shell: bash
        run: |
          set -euo pipefail

          URL="${THANDEV_BASE_URL}/api/code-scans/ingest"
          echo "Ingest URL: $URL"

          curl -sS -i -X POST "$URL" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F "repo=${{ github.repository }}" \
            -F "provider=github" \
            -F "ref=${{ github.ref }}" \
            -F "sha=${{ github.sha }}" \
            -F "run_id=${{ github.run_id }}" \
            -F "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "semgrep_json=@semgrep-output.json" \
            -F "gitleaks_json=@gitleaks.json" \
            -F "osv_json=@osv.json" \
            -F "trivy_json=@trivy.json" \
            -F "sbom_json=@syft_sbom.json" \
            | head -n 80