name: Thandev Code Scan

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
  pull_request: {}

jobs:
  code-scan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Base URL: keep it simple & visible for users.
      # You can still override via repo variable THANDEV_BASE_URL if you want.
      - name: Set THANDEV_BASE_URL
        id: base
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT="https://thandev-backend.fly.dev"
          BASE="${{ vars.THANDEV_BASE_URL }}"
          if [ -z "${BASE}" ]; then BASE="$DEFAULT"; fi
          echo "THANDEV_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "Using THANDEV_BASE_URL=$BASE"

      - name: Ping Thandev code-scan API
        shell: bash
        run: |
          set -euo pipefail
          curl -sS "${THANDEV_BASE_URL}/api/code-scans/ping"

      # ✅ Get OIDC token using GitHub's native OIDC env vars (more reliable than github-script)
      - name: Request OIDC token (GitHub native)
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=thandev"
          TOK="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$URL" \
            | python -c "import sys,json; print(json.load(sys.stdin)['value'])")"
          echo "id_token=$TOK" >> "$GITHUB_OUTPUT"

      # Debug token claims to diagnose aud/iss/nbf/exp issues
      - name: Inspect OIDC token claims (debug)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, base64
          tok = """${{ steps.oidc.outputs.id_token }}"""
          h,p,_ = tok.split(".")
          def b64url(s):
            s += "=" * (-len(s) % 4)
            return base64.urlsafe_b64decode(s.encode())
          header = json.loads(b64url(h))
          payload = json.loads(b64url(p))
          print("HEADER:", json.dumps({k: header.get(k) for k in ["alg","kid","typ"]}, indent=2))
          print("PAYLOAD subset:", json.dumps({k: payload.get(k) for k in ["iss","aud","iat","nbf","exp","repository","ref","sha","actor","sub"]}, indent=2))
          PY

      - name: Get Thandev ingest token
        id: token
        shell: bash
        run: |
          set -euo pipefail
          URL="${THANDEV_BASE_URL}/api/code-scans/oidc/exchange/github"
          RESP="$(curl -sS -w "\nHTTP_STATUS=%{http_code}\n" -X POST "$URL" \
            -H "Content-Type: application/json" \
            -d "{\"oidc_token\":\"${{ steps.oidc.outputs.id_token }}\"}")"
          STATUS="$(echo "$RESP" | sed -n 's/^HTTP_STATUS=//p')"
          BODY="$(echo "$RESP" | sed '/^HTTP_STATUS=/d')"

          echo "Exchange HTTP: $STATUS"
          echo "Exchange body: $BODY"

          if [ "$STATUS" != "200" ]; then
            echo "OIDC exchange failed."
            exit 1
          fi

          ACCESS_TOKEN="$(python -c "import json,sys; print(json.loads(sys.argv[1])['access_token'])" "$BODY")"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Semgrep (SAST)
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan --config=auto --json --output semgrep-output.json .

      - name: Gitleaks (Secrets)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --report-format json --report-path gitleaks.json --no-git

      - name: OSV-Scanner (Dependencies)
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o osv-scanner
          chmod +x ./osv-scanner
          ./osv-scanner scan --format=json --output osv.json .

      - name: Trivy FS (Vuln + Misconfig)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          scanners: vuln,misconfig
          ignore-unfixed: true

      - name: Syft (SBOM - CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: syft_sbom.json

      - name: Ingest to Thandev
        shell: bash
        run: |
          set -euo pipefail
          curl -sS -w "\nHTTP_STATUS=%{http_code}\n" -X POST "${THANDEV_BASE_URL}/api/code-scans/ingest" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F "repo=${{ github.repository }}" \
            -F "provider=github" \
            -F "ref=${{ github.ref }}" \
            -F "sha=${{ github.sha }}" \
            -F "run_id=${{ github.run_id }}" \
            -F "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "semgrep_json=@semgrep-output.json" \
            -F "gitleaks_json=@gitleaks.json" \
            -F "osv_json=@osv.json" \
            -F "trivy_json=@trivy.json" \
            -F "sbom_json=@syft_sbom.json"