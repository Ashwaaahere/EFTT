name: Thandev Code Scan

on:
  workflow_dispatch: {}
  push:
    branches: ["main"]
  pull_request: {}

concurrency:
  group: thandev-code-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      id-token: write
      contents: read

    env:
      THANDEV_BASE_URL: https://thandev-backend.fly.dev

      # Pin tool versions for reproducibility (change anytime)
      SEMGREP_VERSION: "1.95.0"
      GITLEAKS_VERSION: "8.24.3"
      OSV_VERSION: "v2.0.2"         # optional; "latest" is OK too
      TRIVY_VERSION: "0.24.0"       # matches your action usage
      SBOM_ACTION_VERSION: "v0"     # anchore/sbom-action major tag

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Quick ping to verify backend reachable
      # -----------------------------
      - name: Ping Thandev code-scan API
        shell: bash
        run: |
          set -euo pipefail
          echo "Pinging: ${THANDEV_BASE_URL}/api/code-scans/ping"
          curl -sS -i "${THANDEV_BASE_URL}/api/code-scans/ping" | head -n 30 || true

      # -----------------------------
      # OIDC token from GitHub + debug claims (optional)
      # -----------------------------
      - name: Request OIDC token (GitHub native)
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('thandev');
            core.setOutput('id_token', token);

      - name: Inspect OIDC token claims (debug)
        shell: bash
        env:
          TOKEN: ${{ steps.oidc.outputs.id_token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, base64
          t = os.environ["TOKEN"]
          h,p,_ = t.split(".")
          def b64(s):
            s += "=" * (-len(s) % 4)
            return json.loads(base64.urlsafe_b64decode(s.encode()).decode())
          header = b64(h)
          payload = b64(p)
          safe = {k: payload.get(k) for k in ["iss","aud","sub","repository","ref","sha","actor","iat","exp"]}
          print("HEADER:", json.dumps({k: header.get(k) for k in ["alg","kid","typ"]}, indent=2))
          print("PAYLOAD subset:", json.dumps(safe, indent=2))
          PY

      # -----------------------------
      # Exchange OIDC -> Thandev ingest token
      # -----------------------------
      - name: Get Thandev ingest token (OIDC exchange)
        id: token
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.id_token }}
        run: |
          set -euo pipefail
          URL="${THANDEV_BASE_URL}/api/code-scans/oidc/exchange/github"
          echo "Exchange URL: $URL"

          JSON_BODY="$(python - <<'PY'
          import json, os
          print(json.dumps({"oidc_token": os.environ["OIDC_TOKEN"]}))
          PY
          )"

          RESP="$(
            curl -sS -w "\nHTTP_STATUS=%{http_code}\n" \
              -X POST "$URL" \
              -H "Content-Type: application/json" \
              -d "$JSON_BODY"
          )"

          STATUS="$(echo "$RESP" | sed -n 's/^HTTP_STATUS=//p')"
          BODY="$(echo "$RESP" | sed '/^HTTP_STATUS=/d')"

          echo "Exchange HTTP: $STATUS"
          echo "Exchange body: $BODY"

          if [ "$STATUS" != "200" ]; then
            echo "❌ OIDC exchange failed."
            exit 1
          fi

          ACCESS_TOKEN="$(python -c "import json,sys; print(json.loads(sys.argv[1])['access_token'])" "$BODY")"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      # -----------------------------
      # Python setup + pip caching (best practice)
      # -----------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Semgrep
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install "semgrep==${SEMGREP_VERSION}"

      # Optional: Semgrep cache (speeds up rules + parsing in some cases)
      - name: Cache Semgrep
        uses: actions/cache@v4
        with:
          path: ~/.cache/semgrep
          key: semgrep-${{ runner.os }}-${{ env.SEMGREP_VERSION }}

      - name: Semgrep (SAST)
        shell: bash
        run: |
          set -euo pipefail
          semgrep scan --config=auto --json --output semgrep-output.json . || true
          test -f semgrep-output.json || echo '{}' > semgrep-output.json

      # -----------------------------
      # Cache + install binaries (Gitleaks + OSV)
      # -----------------------------
      - name: Cache scanner binaries
        uses: actions/cache@v4
        with:
          path: ./.thandev-bin
          key: thandev-bin-${{ runner.os }}-gitleaks${{ env.GITLEAKS_VERSION }}-osv${{ env.OSV_VERSION }}

      - name: Install Gitleaks + OSV (binaries)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .thandev-bin

          # ---- Gitleaks
          if [ ! -x ".thandev-bin/gitleaks" ]; then
            echo "Downloading gitleaks ${GITLEAKS_VERSION}..."
            curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
              -o /tmp/gitleaks.tgz
            tar -xzf /tmp/gitleaks.tgz -C .thandev-bin gitleaks
            chmod +x .thandev-bin/gitleaks
          else
            echo "Using cached gitleaks"
          fi

          # ---- OSV scanner (you can switch to latest if you prefer)
          if [ ! -x ".thandev-bin/osv-scanner" ]; then
            echo "Downloading osv-scanner..."
            if [ "${OSV_VERSION}" = "latest" ]; then
              curl -sSfL "https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64" \
                -o .thandev-bin/osv-scanner
            else
              curl -sSfL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" \
                -o .thandev-bin/osv-scanner
            fi
            chmod +x .thandev-bin/osv-scanner
          else
            echo "Using cached osv-scanner"
          fi

      - name: Gitleaks (Secrets)
        shell: bash
        run: |
          set -euo pipefail
          ./.thandev-bin/gitleaks detect \
            --source . \
            --no-git \
            --report-format json \
            --report-path gitleaks.json \
            || true
          test -f gitleaks.json || echo '{}' > gitleaks.json

      - name: OSV-Scanner (Dependencies)
        shell: bash
        run: |
          set -euo pipefail

          if ls package-lock.json yarn.lock pnpm-lock.yaml requirements.txt poetry.lock Pipfile.lock go.mod go.sum Cargo.lock 2>/dev/null; then
            ./.thandev-bin/osv-scanner scan --format=json --output osv.json . || true
          else
            echo "No dependency manifests found. Skipping OSV scan."
            echo '{}' > osv.json
          fi
          test -f osv.json || echo '{}' > osv.json

      # -----------------------------
      # Trivy (with cache)
      # -----------------------------
      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-${{ runner.os }}-${{ env.TRIVY_VERSION }}

      - name: Trivy FS (Vuln + Misconfig)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy.json
          scanners: vuln,misconfig
          ignore-unfixed: true

      - name: Ensure trivy.json exists
        shell: bash
        run: |
          set -euo pipefail
          test -f trivy.json || echo '{}' > trivy.json

      # -----------------------------
      # SBOM (CycloneDX)
      # -----------------------------
      - name: Syft (SBOM - CycloneDX JSON)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: syft_sbom.json

      # Safety net: some environments/actions still produce *.cyclonedx.json
      - name: Normalize SBOM filename
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "syft_sbom.json" ]; then
            echo "✅ SBOM exists: syft_sbom.json"
          else
            echo "syft_sbom.json missing. Looking for *.cyclonedx.json..."
            CANDIDATE="$(ls -1 *.cyclonedx.json 2>/dev/null | head -n 1 || true)"
            if [ -n "$CANDIDATE" ]; then
              echo "✅ Found: $CANDIDATE → copying to syft_sbom.json"
              cp "$CANDIDATE" syft_sbom.json
            else
              echo "❌ No SBOM file found; creating empty SBOM."
              echo '{}' > syft_sbom.json
            fi
          fi

      # -----------------------------
      # Verify artifacts (prevents curl 26)
      # -----------------------------
      - name: Verify artifacts exist (debug)
        shell: bash
        run: |
          set -euo pipefail
          echo "=== workspace files ==="
          ls -lah
          echo "=== expected artifacts ==="
          for f in semgrep-output.json gitleaks.json osv.json trivy.json syft_sbom.json; do
            if [ -f "$f" ]; then
              echo "✅ $f exists ($(wc -c < "$f") bytes)"
            else
              echo "❌ MISSING: $f"
            fi
          done

      # -----------------------------
      # Ingest to Thandev
      # -----------------------------
      - name: Ingest to Thandev
        shell: bash
        run: |
          set -euo pipefail

          # Hard fail early if any file is missing (prevents curl:26 confusion)
          for f in semgrep-output.json gitleaks.json osv.json trivy.json syft_sbom.json; do
            test -f "$f" || (echo "❌ Missing required file: $f" && exit 2)
          done

          URL="${THANDEV_BASE_URL}/api/code-scans/ingest"
          echo "Ingest URL: $URL"

          curl -sS -i -X POST "$URL" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            -F "repo=${{ github.repository }}" \
            -F "provider=github" \
            -F "ref=${{ github.ref }}" \
            -F "sha=${{ github.sha }}" \
            -F "run_id=${{ github.run_id }}" \
            -F "run_url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F "semgrep_json=@semgrep-output.json;type=application/json" \
            -F "gitleaks_json=@gitleaks.json;type=application/json" \
            -F "osv_json=@osv.json;type=application/json" \
            -F "trivy_json=@trivy.json;type=application/json" \
            -F "sbom_json=@syft_sbom.json;type=application/json" \
            | head -n 120
